<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | AQI Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-100 via-white to-green-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold mb-6 text-center text-blue-800">Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="mb-4 text-sm text-red-600">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form method="POST" action="/login" class="space-y-5">
            <input type="email" name="email" placeholder="Email" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500" />
            <input type="password" name="password" placeholder="Password" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500" />
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-xl hover:bg-blue-700 transition">Log In</button>
        </form>
        <p class="text-sm text-center mt-4">Don't have an account?
            <a href="/signup" class="text-blue-600 hover:underline">Sign up here</a>
        </p>
    </div>
</body>
</html>
